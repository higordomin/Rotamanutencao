name: Android APK de teste
on:
  pull_request:
    paths:
      - 'mvp/mobile/**'
      - '.github/workflows/android-apk-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mvp/mobile
    env:
      CI: 'true'
      ROTA_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar projeto nativo Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK release com assinatura de desenvolvimento
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Validar pacote, versão e assinatura QA
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | grep -m 1 '^package:')"
          echo "$BADGING"
          [[ "$BADGING" == *"name='br.com.rotamanutencao.qa'"* ]] || { echo 'ID QA alterado!'; exit 1; }
          [[ "$BADGING" == *"versionCode='330'"* ]] || { echo 'versionCode inesperado!'; exit 1; }
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | grep -F 'android.permission.SCHEDULE_EXACT_ALARM' || {
            echo 'Permissão de alarmes exatos não apareceu no manifesto nativo!'; exit 1;
          }
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/rotamanutencao-qa-signature.txt
          # Debug keystore de template, observada nos APKs 0.4-0.6. Somente QA.
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' /tmp/rotamanutencao-qa-signature.txt || {
            echo 'Certificado QA alterado; atualizações seriam rejeitadas pelo Android.'
            exit 1
          }
      - name: Publicar artefato instalável de teste
        uses: actions/upload-artifact@v4
        with:
          name: RotaManutencao-0_33_0-APK
          path: mvp/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
