name: Mobile CI
on:
  push:
    paths:
      - 'mvp/mobile/**'
      - 'mvp/.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mvp/mobile/**'
      - 'mvp/.github/workflows/mobile-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: python3 tests/sqlite_smoke.py
